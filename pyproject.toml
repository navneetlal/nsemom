[project]
name            = "nsemom"
version         = "0.1.0"
description     = "Deterministic NSE momentum screener and backtester"
requires-python = ">=3.11"
dependencies    = ["duckdb", "pandas", "requests"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
nsemom = "nsemom.cli:main"

[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
